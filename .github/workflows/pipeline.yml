name: Truth-Tide Autonomous Pipeline

# 1. THE TRIGGER: When should this run?
on:
  schedule:
    # This is a "Cron" expression. It means: "Run at minute 0 past every 12th hour."
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # This adds a manual "Run Workflow" button on GitHub so you can test it anytime.

# 2. THE WORK: What exactly are we doing?
jobs:
  siphon-and-analyze:
    runs-on: ubuntu-latest # GitHub gives us a free Linux server

    steps:
    - name:    Checkout Repository
      uses: actions/checkout@v3

    - name:    Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # latest version for our ML libraries

    - name:    Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name:    Run (Data Siphon)
      run: python data_siphon.py

    - name:  Run OSINT Siphon (Reddit)
      env:
        # This injects the secure keys from GitHub into our Python script!
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      run: python reddit_siphon.py

    - name:    Run (Semantic Engine)
      run: python semantic_engine.py

    - name:    Commit and Push New Intelligence
      run: |
        # Tell Git who is making the commit
        git config --local user.email "action@github.com"
        git config --local user.name "Truth-Tide Bot"
        
        # Add the new data files
        git add data/
        
        # Check if there is actually new data. If yes, commit and push.
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-Update: Siphoned new headlines and mapped semantics"
        git push
    - name:   Deploy Fresh Intelligence to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Connect the GitHub bot directly to your Hugging Face Space
        git remote add huggingface https://SFG006:${HF_TOKEN}@huggingface.co/spaces/SFG006/Truth-Tide-API

            # Push the freshly updated data to the API server
            git push huggingface HEAD:main --force