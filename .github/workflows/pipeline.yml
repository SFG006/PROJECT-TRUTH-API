name: Truth-Tide Autonomous Pipeline

# 1. THE TRIGGER: When should this run?
on:
  schedule:
    # Run at minute 0 past every 12th hour.
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Manual "Run Workflow" button on GitHub

# 2. THE WORK: What exactly are we doing?
jobs:
  siphon-and-analyze:
    runs-on: ubuntu-latest # GitHub gives us a free Linux server

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # THE FIX: Tells GitHub to download the full history so Hugging Face accepts the push

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Global News Siphon
      run: python data_siphon.py

    - name: Run OSINT Reddit Siphon
      env:
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      run: python reddit_siphon.py

    # --- THE FIX: Run the Tactic Engine (which auto-triggers Semantic Engine) ---
    - name: Run AI Tactic & Semantic Engines
      run: python tactic_engine.py
    # ----------------------------------------------------------------------------

    - name: Commit and Push New Intelligence
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Truth-Tide Bot"
        
        git add data/
        
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-Update: Siphoned new headlines and mapped semantics"
        git push origin LEON

    - name: Deploy Fresh Intelligence to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git remote add huggingface https://SFG006:${HF_TOKEN}@huggingface.co/spaces/SFG006/Truth-Tide-API
        
        # Fixed the indentation on this line!
        git push huggingface HEAD:main --force