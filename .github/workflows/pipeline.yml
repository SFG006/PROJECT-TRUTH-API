name: Project Truth Automated Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # This standard cron syntax tells GitHub to run this at 00:00 (Midnight) UTC every single day.
    - cron: '0 0 * * *'

jobs:
  sync-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      # STEP 1: EXTRACT (Fetch fresh raw data)
      - name: Run Raw Data Siphon
        run: |
          python data_siphon.py

      # STEP 2: TRANSFORM (Process the new raw data)
      - name: Run Tactic Siphon
        run: |
          python tactic_engine.py
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          HF_HUB_ENABLE_HF_TRANSFER: 0

      # STEP 3: COMMIT ALL CHANGES (Locally on the runner)
      - name: Commit fresh raw and processed data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage both folders
          git add data/raw/
          git add data/processed/
          
          # Commit only if there are actual changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Pipeline: Auto-fetch raw data and update tactic classifications"

      # STEP 4: LOAD TO GITHUB (Push the new data back to your repo)
      - name: Push updates to GitHub
        run: |
          git pull origin $GITHUB_REF_NAME --no-rebase --strategy-option=ours
          git push origin HEAD:$GITHUB_REF_NAME

      # STEP 5: HUGGING FACE DEPLOY
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF__TOKEN }}
        run: |
          git remote add huggingface https://oauth2:$HF_TOKEN@huggingface.co/spaces/SFG006/Project-Truth-API
          
          # Download the current live state of Hugging Face
          git fetch huggingface main
          
          # Overwrite the runner's local README with the Hugging Face version
          git checkout huggingface/main -- README.md
          
          # Commit the rescued README
          git add README.md
          git commit -m "Pipeline: Preserve Hugging Face README" || echo "No changes to README"
          
          # Push the final package to Hugging Face
          git push huggingface HEAD:main --force