name: Truth-Tide OSINT Pipeline

# This tells GitHub WHEN to run the script
on:
  push:
    paths:
      - 'data/raw/**' # Runs automatically if you upload a new raw CSV
  workflow_dispatch: # Adds a "Run Workflow" button in the GitHub UI so you can trigger it manually

jobs:
  run-intelligence-engine:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # This forces a FULL clone of the history
          lfs: true         # This ensures Large File Storage pointers are resolved

      - name:  Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name:  Install Dependencies
        # Notice we included umap-learn here since we added 3D coordinates!
        run: |
          python -m pip install --upgrade pip
          pip install pandas groq tqdm sentence-transformers scikit-learn chromadb umap-learn

      - name:  Run Truth-Tide Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Since tactic_engine.py automatically triggers semantic_engine.py, we only need to run this one script
        run: python tactic_engine.py

      - name:  Commit and Push Processed Data
        run: |
          git config --global user.name "Truth-Tide Bot"
          git config --global user.email "actions@github.com"
          
          # Force add the processed files (in case they were previously ignored)
          git add -f data/processed/master_tactics_latest.csv
          git add -f data/processed/narrative_report.json
          
          # Only commit if the AI actually changed the data
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update OSINT dashboard data"
          git push

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF__TOKEN }}
        run: |
          # Set up the secure Hugging Face URL
          git remote add huggingface https://oauth2:$HF_TOKEN@huggingface.co/spaces/SFG006/Truth-Tide-API
          # Use HEAD:main to push your current branch (LEON) to Hugging Face's main branch
          git push huggingface HEAD:main --force