name: Truth-Tide Automated Pipeline

on:
  push:
    branches: [main]
  # Optional: Run this on a daily schedule automatically
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required by Hugging Face to avoid shallow clone errors
          lfs: true       # Required to process any large files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      # STEP 1: EXTRACT (Fetch fresh raw data)
      - name: Run Raw Data Siphons
        run: |
          python data_siphon.py
          python reddit_siphon.py
        env:
          # Inject secrets if your Reddit script requires them
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      # STEP 2: TRANSFORM (Process the new raw data)
      - name: Run Tactic Siphon
        run: |
          python tactic_siphon.py
        env:
          # Depending on how your zero-shot model is configured, you may need your HF token here
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # STEP 3: COMMIT ALL CHANGES
      - name: Commit fresh raw and processed data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage both folders explicitly
          git add data/raw/
          git add data/processed/
          
          # Commit only if there are actual changes to avoid pipeline crashes
          git diff --quiet && git diff --staged --quiet || git commit -m "Pipeline: Auto-fetch raw data and update tactic classifications"

      # STEP 4: LOAD (Push everything to Hugging Face)
      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Set the remote URL using your secret token for authentication
          git remote add huggingface https://oauth2:$HF_TOKEN@huggingface.co/spaces/SFG006/Truth-Tide-API || git remote set-url huggingface https://oauth2:$HF_TOKEN@huggingface.co/spaces/SFG006/Truth-Tide-API
          
          # Push the updated main branch to Hugging Face
          git push --force huggingface main